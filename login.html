const status = document.getElementById("status");
document.getElementById("loginBtn").onclick = login;

async function login() {
  try {
    if (!window.ethereum) {
      alert("กรุณาติดตั้ง MetaMask");
      return;
    }

    // 🔥 ขอ permission จาก MetaMask (สำคัญ)
    const accounts = await window.ethereum.request({
      method: "eth_requestAccounts"
    });

    if (!accounts || accounts.length === 0) {
      alert("ไม่พบบัญชี MetaMask");
      return;
    }

    const user = accounts[0].toLowerCase();
    status.innerText = "Account: " + user;

    const provider = new ethers.providers.Web3Provider(window.ethereum);
    const network = await provider.getNetwork();

    // 🔒 บังคับ Sepolia
    if (network.chainId !== 11155111) {
      alert("กรุณาเปลี่ยน Network เป็น Sepolia");
      return;
    }

    const contract = new ethers.Contract(CONTRACT_ADDRESS, abi, provider);

    const withdrawers = (await contract.getWithdrawers()).map(a => a.toLowerCase());
    const approvers = (await contract.getApprovers()).map(a => a.toLowerCase());

    if (withdrawers.includes(user)) {
      window.location.href = "withdrawer.html";
    } else if (approvers.includes(user)) {
      window.location.href = "approver.html";
    } else {
      window.location.href = "user.html";
    }

  } catch (err) {
    console.error(err);
    alert("เกิดข้อผิดพลาด: " + err.message);
  }
}
