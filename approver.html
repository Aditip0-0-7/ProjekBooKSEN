<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Approver</title>
<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>

<h2>หน้า ผู้อนุมัติ</h2>
<p>บทบาท: <strong id="role">กำลังตรวจสอบ...</strong></p>

<table border="1" cellpadding="6">
<thead>
<tr>
<th>#</th>
<th>Amount (ETH)</th>
<th>Purpose</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>
const contractAddress = "0x91991Be7C7D961Fb24583f7DB50013aE7E56c9F9";
const abi = [
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "index",
				"type": "uint256"
			}
		],
		"name": "approveWithdraw",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "donate",
		"outputs": [],
		"stateMutability": "payable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "amount",
				"type": "uint256"
			},
			{
				"internalType": "string",
				"name": "purpose",
				"type": "string"
			}
		],
		"name": "requestWithdraw",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "_withdrawer",
				"type": "address"
			}
		],
		"stateMutability": "nonpayable",
		"type": "constructor"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "index",
				"type": "uint256"
			}
		],
		"name": "withdraw",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "approver",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "getWithdrawRequestCount",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "withdrawer",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"name": "withdrawRequests",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "amount",
				"type": "uint256"
			},
			{
				"internalType": "string",
				"name": "purpose",
				"type": "string"
			},
			{
				"internalType": "bool",
				"name": "approved",
				"type": "bool"
			},
			{
				"internalType": "bool",
				"name": "withdrawn",
				"type": "bool"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
];

let web3, contract, user;

async function connect() {
  web3 = new Web3(window.ethereum);
  const accs = await ethereum.request({ method: "eth_requestAccounts" });
  user = accs[0];

  contract = new web3.eth.Contract(abi, contractAddress);

  const approver = await contract.methods.approver().call();
  if (user.toLowerCase() !== approver.toLowerCase()) {
    alert("คุณไม่ใช่ผู้อนุมัติ");
    document.body.innerHTML = "";
    return;
  }

  document.getElementById("role").innerText = "ผู้อนุมัติ";
  load();
}

async function load() {
  const tbody = document.getElementById("list");
  tbody.innerHTML = "";

  const count = await contract.methods.getWithdrawRequestCount().call();

  for (let i = 0; i < count; i++) {
    const r = await contract.methods.withdrawRequests(i).call();

    let status = "⏳ รออนุมัติ";
    let btn = "-";

    if (!r.approved) {
      btn = `<button onclick="approve(${i})">อนุมัติ</button>`;
    }
    if (r.approved && !r.withdrawn) status = "✅ อนุมัติแล้ว";
    if (r.withdrawn) status = "💸 ถอนแล้ว";

    tbody.innerHTML += `
      <tr>
        <td>${i}</td>
        <td>${web3.utils.fromWei(r.amount,"ether")}</td>
        <td>${r.purpose}</td>
        <td>${status}</td>
        <td>${btn}</td>
      </tr>`;
  }
}

async function approve(i) {
  await contract.methods.approveWithdraw(i).send({ from: user });
  load();
}

connect();
</script>

</body>
</html>
