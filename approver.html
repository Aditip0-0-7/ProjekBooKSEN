<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Approver</title>
<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>

<h2>🔐 หน้าอนุมัติการเบิก (Approver)</h2>

<p id="role"></p>

<hr>

<h3>📋 คำขอเบิกทั้งหมด</h3>

<table border="1">
<thead>
<tr>
<th>Index</th>
<th>Amount (ETH)</th>
<th>Purpose</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>
/* ================= CONFIG ================= */

const contractAddress = "0x8aeE86E718015094bBD2e40263B894965fe32699";

const abi = [
    {"inputs":[{"internalType":"uint256","name":"index","type":"uint256"}],"name":"approveWithdraw","outputs":[],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[],"name":"approver","outputs":[{"internalType":"address","name":"","type":"address"}],"stateMutability":"view","type":"function"},
    {"inputs":[],"name":"getWithdrawRequestCount","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"withdrawRequests","outputs":[
        {"internalType":"uint256","name":"amount","type":"uint256"},
        {"internalType":"string","name":"purpose","type":"string"},
        {"internalType":"bool","name":"approved","type":"bool"},
        {"internalType":"bool","name":"withdrawn","type":"bool"}
    ],"stateMutability":"view","type":"function"}
];

/* ================= GLOBAL ================= */

let web3, contract, account;

/* ================= CONNECT ================= */

async function connect() {
    if (!window.ethereum) {
        alert("กรุณาติดตั้ง MetaMask");
        return;
    }

    web3 = new Web3(window.ethereum);
    const accs = await ethereum.request({ method: "eth_requestAccounts" });
    account = accs[0];

    contract = new web3.eth.Contract(abi, contractAddress);

    const approverAddress = await contract.methods.approver().call();

    if (account.toLowerCase() !== approverAddress.toLowerCase()) {
        document.getElementById("role").innerHTML =
            "❌ Wallet นี้ไม่ใช่ผู้อนุมัติ";
        return;
    }

    document.getElementById("role").innerHTML =
        "✅ Wallet นี้คือผู้อนุมัติ";

    loadRequests();
}

/* ================= LOAD REQUESTS ================= */

async function loadRequests() {
    const tbody = document.getElementById("list");
    tbody.innerHTML = "";

    const count = await contract.methods.getWithdrawRequestCount().call();

    for (let i = 0; i < count; i++) {
        const r = await contract.methods.withdrawRequests(i).call();

        let status = "⏳ รออนุมัติ";
        let action = "-";

        if (r.approved && !r.withdrawn) {
            status = "✅ อนุมัติแล้ว";
        }

        if (!r.approved) {
            action = `<button onclick="approve(${i})">อนุมัติ</button>`;
        }

        if (r.withdrawn) {
            status = "💸 ถอนแล้ว";
            action = "-";
        }

        tbody.innerHTML += `
        <tr>
            <td>${i}</td>
            <td>${web3.utils.fromWei(r.amount,"ether")}</td>
            <td>${r.purpose}</td>
            <td>${status}</td>
            <td>${action}</td>
        </tr>`;
    }
}

/* ================= APPROVE ================= */

async function approve(index) {
    await contract.methods.approveWithdraw(index).send({ from: account });
    alert("อนุมัติสำเร็จ");
    loadRequests();
}

/* ================= START ================= */

connect();
</script>

</body>
</html>
