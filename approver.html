<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Approver</title>
<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>

<h2>หน้า ผู้อนุมัติ</h2>
<p>บทบาท: <strong id="role">กำลังตรวจสอบ...</strong></p>

<hr>

<h3>อนุมัติการเบิกเงิน</h3>
<input id="index" placeholder="ลำดับคำขอ">
<button onclick="approve()">อนุมัติ</button>

<script>
const contractAddress = "0x8aeE86E718015094bBD2e40263B894965fe32699";
const abi = [
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "_withdrawer",
				"type": "address"
			}
		],
		"stateMutability": "nonpayable",
		"type": "constructor"
	},
	{
		"inputs": [],
		"name": "approver",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "donate",
		"outputs": [],
		"stateMutability": "payable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"name": "donations",
		"outputs": [
			{
				"internalType": "address",
				"name": "donor",
				"type": "address"
			},
			{
				"internalType": "uint256",
				"name": "amount",
				"type": "uint256"
			},
			{
				"internalType": "uint256",
				"name": "time",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "index",
				"type": "uint256"
			}
		],
		"name": "getDonation",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			},
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			},
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "getDonationCount",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "totalDonation",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "withdrawer",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
]; // ABI เดิม

let web3, contract, user;

async function connect() {
    web3 = new Web3(window.ethereum);
    await ethereum.request({ method: "eth_requestAccounts" });
    user = (await web3.eth.getAccounts())[0];
    contract = new web3.eth.Contract(abi, contractAddress);

    const approver = await contract.methods.approver().call();

    if (user.toLowerCase() !== approver.toLowerCase()) {
        alert("คุณไม่ใช่ผู้อนุมัติ");
        document.body.innerHTML = "";
        return;
    }

    document.getElementById("role").innerText = "ผู้อนุมัติ";
}

async function approve() {
    const index = document.getElementById("index").value;
    await contract.methods.approveWithdraw(index).send({ from: user });
    alert("อนุมัติเรียบร้อย");
}

connect();
</script>

</body>
</html>
