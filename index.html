<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Transparent Charity Platform</title>

    <!-- Web3 -->
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        input, button {
            padding: 6px;
            margin: 4px;
        }
    </style>
</head>

<body>

<h2>แพลตฟอร์มระดมทุนเพื่อการกุศล (โปร่งใส)</h2>

<p>
    💰 ยอดเงินบริจาครวม:
    <strong><span id="total">0</span> ETH</strong>
</p>

<input type="number" id="amount" placeholder="จำนวน ETH" step="0.001">
<button onclick="donate()">บริจาค</button>

<hr>

<button onclick="loadTotal()">โหลดข้อมูลล่าสุด</button>

<p id="status"></p>

<script>
/* ================== CONFIG ================== */
const contractAddress = "0x8aee86e718015094bbd2e40263b894965fe32699";

const abi = [
  {
    "inputs": [],
    "name": "donate",
    "outputs": [],
    "stateMutability": "payable",
    "type": "function"
  },
  {
    "inputs": [],
    "name": "totalDonation",
    "outputs": [
      { "internalType": "uint256", "name": "", "type": "uint256" }
    ],
    "stateMutability": "view",
    "type": "function"
  }
];
/* ============================================ */

let web3;
let contract;

/* 🔌 เชื่อมต่อ MetaMask */
async function connect() {
    if (!window.ethereum) {
        alert("กรุณาติดตั้ง MetaMask");
        return;
    }

    web3 = new Web3(window.ethereum);
    await ethereum.request({ method: "eth_requestAccounts" });

    contract = new web3.eth.Contract(abi, contractAddress);

    document.getElementById("status").innerText = "✅ เชื่อมต่อ MetaMask แล้ว";

    loadTotal();
    startAutoUpdate();
}

/* 💸 บริจาค */
async function donate() {
    try {
        const accounts = await web3.eth.getAccounts();
        const ethAmount = document.getElementById("amount").value;

        if (ethAmount <= 0) {
            alert("กรุณากรอกจำนวน ETH");
            return;
        }

        await contract.methods.donate().send({
            from: accounts[0],
            value: web3.utils.toWei(ethAmount, "ether")
        });

        alert("🎉 บริจาคสำเร็จ");
        document.getElementById("amount").value = "";
        loadTotal();

    } catch (err) {
        console.error(err);
        alert("❌ การทำรายการถูกยกเลิก");
    }
}

/* 📊 โหลดยอดเงินรวม */
async function loadTotal() {
    if (!contract) return;

    const total = await contract.methods.totalDonation().call();
    document.getElementById("total").innerText =
        web3.utils.fromWei(total, "ether");
}

/* 🔄 อัปเดตอัตโนมัติทุก 3 วินาที */
function startAutoUpdate() {
    setInterval(loadTotal, 3000);
}

/* เริ่มทำงาน */
connect();
</script>

</body>
</html>
