<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Transparent Charity</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>

<h2>แพลตฟอร์มระดมทุนเพื่อการกุศล</h2>

<p>ยอดเงินบริจาครวม: <span id="total">0</span> ETH</p>

<input type="number" id="amount" placeholder="จำนวน ETH">
<button onclick="donate()">บริจาค</button>

<hr>

<h3>ตรวจสอบเส้นทางเงิน</h3>
<button onclick="load()">โหลดข้อมูล</button>

<script>
let web3;
let contract;

const contractAddress = "0x8aeE86E718015094bBD2e40263B894965fe32699";
const abi = [
	{
		"inputs": [
			{ "internalType": "uint256", "name": "index", "type": "uint256" }
		],
		"name": "approveWithdraw",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "donate",
		"outputs": [],
		"stateMutability": "payable",
		"type": "function"
	},
	{
		"inputs": [
			{ "internalType": "uint256", "name": "_amount", "type": "uint256" },
			{ "internalType": "string", "name": "_purpose", "type": "string" }
		],
		"name": "requestWithdraw",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [{ "internalType": "address", "name": "_withdrawer", "type": "address" }],
		"stateMutability": "nonpayable",
		"type": "constructor"
	},
	{
		"inputs": [{ "internalType": "uint256", "name": "index", "type": "uint256" }],
		"name": "withdraw",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "totalDonation",
		"outputs": [{ "internalType": "uint256", "name": "", "type": "uint256" }],
		"stateMutability": "view",
		"type": "function"
	}
];


async function connect() {
    if (window.ethereum) {
        web3 = new Web3(window.ethereum);
        await ethereum.request({ method: 'eth_requestAccounts' });
        contract = new web3.eth.Contract(abi, contractAddress);
    }
}

async function donate() {
    const accounts = await web3.eth.getAccounts();
    const eth = document.getElementById("amount").value;

    await contract.methods.donate().send({
        from: accounts[0],
        value: web3.utils.toWei(eth, "ether")
    });

    alert("บริจาคสำเร็จ");
}

async function load() {
    const total = await contract.methods.totalDonation().call();
    document.getElementById("total").innerText =
        web3.utils.fromWei(total, "ether");
}

connect();
</script>

</body>
</html>
