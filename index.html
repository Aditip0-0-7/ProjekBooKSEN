<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Transparent Charity - Donor</title>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>

<h2>แพลตฟอร์มระดมทุนเพื่อการกุศล (Donor)</h2>

<p>Network: <strong id="network">-</strong></p>

<p>
    ยอดเงินบริจาครวม:
    <strong id="total">0</strong> ETH
</p>

<hr>

<h3>💚 บริจาคเงิน</h3>
<input type="number" id="amount" placeholder="จำนวน ETH" step="0.001">
<button onclick="donate()">บริจาค</button>

<hr>

<h3>🔍 ตรวจสอบเส้นทางการเงิน (Transparency)</h3>
<button onclick="loadTimeline()">ดูเส้นทางการเงิน</button>

<ul id="timeline"></ul>

<hr>

<h3>เมนูจัดการ (เฉพาะผู้มีสิทธิ์)</h3>
<button onclick="goApprover()">🔐 หน้าอนุมัติ (Approver)</button>
<button onclick="goWithdrawer()">💸 หน้าเบิกเงิน (Withdrawer)</button>

<script>
/* ================= CONFIG ================= */

const SEPOLIA_CHAIN_ID = "0xaa36a7"; // 11155111
const contractAddress = "0x8aeE86E718015094bBD2e40263B894965fe32699";

/* ABI */
const abi = [
    {
        "inputs": [],
        "name": "donate",
        "outputs": [],
        "stateMutability": "payable",
        "type": "function"
    },
    {
        "inputs": [],
        "name": "totalDonation",
        "outputs": [
            { "internalType": "uint256", "name": "", "type": "uint256" }
        ],
        "stateMutability": "view",
        "type": "function"
    },
    {
        "anonymous": false,
        "inputs": [
            { "indexed": true, "internalType": "address", "name": "donor", "type": "address" },
            { "indexed": false, "internalType": "uint256", "name": "amount", "type": "uint256" }
        ],
        "name": "DonationReceived",
        "type": "event"
    },
    {
        "anonymous": false,
        "inputs": [
            { "indexed": false, "internalType": "uint256", "name": "index", "type": "uint256" },
            { "indexed": false, "internalType": "uint256", "name": "amount", "type": "uint256" },
            { "indexed": false, "internalType": "string", "name": "purpose", "type": "string" }
        ],
        "name": "WithdrawRequested",
        "type": "event"
    },
    {
        "anonymous": false,
        "inputs": [
            { "indexed": false, "internalType": "uint256", "name": "index", "type": "uint256" }
        ],
        "name": "WithdrawApproved",
        "type": "event"
    },
    {
        "anonymous": false,
        "inputs": [
            { "indexed": false, "internalType": "uint256", "name": "index", "type": "uint256" }
        ],
        "name": "WithdrawExecuted",
        "type": "event"
    }
];

/* ============== GLOBAL ============== */

let web3;
let contract;

/* ============== NETWORK ============== */

async function switchToSepolia() {
    const chainId = await ethereum.request({ method: "eth_chainId" });
    if (chainId !== SEPOLIA_CHAIN_ID) {
        await ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: SEPOLIA_CHAIN_ID }]
        });
    }
    document.getElementById("network").innerText = "Sepolia";
}

/* ============== CONNECT ============== */

async function connect() {
    if (!window.ethereum) {
        alert("กรุณาติดตั้ง MetaMask");
        return;
    }

    await switchToSepolia();

    web3 = new Web3(window.ethereum);
    await ethereum.request({ method: "eth_requestAccounts" });

    contract = new web3.eth.Contract(abi, contractAddress);

    loadTotal();
    setInterval(loadTotal, 3000);
}

/* ============== DONATE ============== */

async function donate() {
    const accounts = await web3.eth.getAccounts();
    const eth = document.getElementById("amount").value;

    if (!eth || eth <= 0) {
        alert("กรุณาใส่จำนวน ETH");
        return;
    }

    await contract.methods.donate().send({
        from: accounts[0],
        value: web3.utils.toWei(eth, "ether")
    });

    alert("บริจาคสำเร็จ");
    loadTotal();
}

/* ============== TOTAL ============== */

async function loadTotal() {
    const totalWei = await contract.methods.totalDonation().call();
    document.getElementById("total").innerText =
        web3.utils.fromWei(totalWei, "ether");
}

/* ============== TIMELINE ============== */

async function loadTimeline() {
    const list = document.getElementById("timeline");
    list.innerHTML = "";

    const donations = await contract.getPastEvents("DonationReceived", {
        fromBlock: 0,
        toBlock: "latest"
    });

    const requests = await contract.getPastEvents("WithdrawRequested", {
        fromBlock: 0,
        toBlock: "latest"
    });

    const approvals = await contract.getPastEvents("WithdrawApproved", {
        fromBlock: 0,
        toBlock: "latest"
    });

    const withdrawals = await contract.getPastEvents("WithdrawExecuted", {
        fromBlock: 0,
        toBlock: "latest"
    });

    donations.forEach(e => {
        list.innerHTML += `
        <li>💚 บริจาค ${web3.utils.fromWei(e.returnValues.amount,"ether")} ETH
        จาก ${e.returnValues.donor}</li>`;
    });

    requests.forEach(e => {
        list.innerHTML += `
        <li>📝 ขอเบิก (Index ${e.returnValues.index})
        | ${web3.utils.fromWei(e.returnValues.amount,"ether")} ETH
        | ${e.returnValues.purpose}</li>`;
    });

    approvals.forEach(e => {
        list.innerHTML += `
        <li>✅ อนุมัติคำขอ Index ${e.returnValues.index}</li>`;
    });

    withdrawals.forEach(e => {
        list.innerHTML += `
        <li>💸 ถอนเงินสำเร็จ Index ${e.returnValues.index}</li>`;
    });
}

/* ============== NAV ============== */

function goApprover() {
    window.location.href = "approver.html";
}

function goWithdrawer() {
    window.location.href = "withdrawer.html";
}

/* ============== START ============== */

connect();
</script>

</body>
</html>
