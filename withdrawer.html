<ul id="list"></ul>

			}
		],

		"outputs": [],

	},
	{

			{
				"internalType": "uint256",
				"name": "index",
				"type": "uint256"
			}
		],
		"name": "withdraw",
		"outputs": [],
		"stateMutability": "nonpayable",
		"type": "function"
	},
	{
		"anonymous": false,
		"inputs": [
			{
				"indexed": true,
				"internalType": "uint256",
				"name": "index",
				"type": "uint256"
			},
			{
				"indexed": false,
				"internalType": "address",
				"name": "approver",
				"type": "address"
			}
		],
		"name": "WithdrawApproved",

	},
	{
		"anonymous": false,
		"inputs": [
			{
				"indexed": true,
				"internalType": "uint256",
				"name": "index",
				"type": "uint256"
			},
			{
				"indexed": false,
				"internalType": "address",
				"name": "executor",
				"type": "address"
			},
			{
				"indexed": false,
				"internalType": "uint256",
				"name": "amount",
				"type": "uint256"
			}
		],
		"name": "WithdrawExecuted",
		"type": "event"
	},
	{
		"anonymous": false,

			{

				"internalType": "uint256",
				"name": "index",
				"type": "uint256"
			},
			{

				"type": "uint256"
			},
			{

				"name": "purpose",

			}
		],

		"type": "event"
	},
	{

		"type": "receive"
	},
	{
		"inputs": [
			{

				"name": "",
				"type": "uint256"
			},
			{
				"internalType": "address",
				"name": "",

			}
		],
		"name": "approvedBy",
		"outputs": [

		],

	},
	{

			{

			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "getWithdrawers",
		"outputs": [

		],

	},
	{

			}
		],
		"stateMutability": "view",

	},
	{
		"inputs": [
			{

		"outputs": [

				"internalType": "uint256",

			{

				"type": "string"

				"type": "uint256"
			},
			{

			}
		],
		"stateMutability": "view",
		"type": "function"
	}
];

async function requestWithdraw() {
  const provider = new ethers.providers.Web3Provider(window.ethereum);
  const signer = provider.getSigner();
  const contract = new ethers.Contract(CONTRACT_ADDRESS, abi, signer);

  const amount = ethers.utils.parseEther(document.getElementById("amount").value);
  const purpose = document.getElementById("purpose").value;

  await contract.requestWithdraw(amount, purpose);
  alert("ส่งคำขอเรียบร้อย");
}

async function load() {
  const provider = new ethers.providers.Web3Provider(window.ethereum);
  const signer = provider.getSigner();
  const contract = new ethers.Contract(CONTRACT_ADDRESS, abi, signer);

  const count = await contract.getWithdrawRequestCount();
  const ul = document.getElementById("list");

  for (let i = 0; i < count; i++) {
    const r = await contract.withdrawRequests(i);
    if (r[2] >= 2 && !r[3]) {
      const li = document.createElement("li");
      li.innerHTML =
        `#${i} | ${ethers.utils.formatEther(r[0])} ETH
        <button onclick="withdraw(${i})">เบิกเงิน</button>`;
      ul.appendChild(li);
    }
  }
}

async function withdraw(index) {
  const provider = new ethers.providers.Web3Provider(window.ethereum);
  const signer = provider.getSigner();
  const contract = new ethers.Contract(CONTRACT_ADDRESS, abi, signer);
  await contract.withdraw(index);
  alert("เบิกเงินสำเร็จ");
}

load();
</script>

</body>
</html>
