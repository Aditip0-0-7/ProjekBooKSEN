<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Withdrawer</title>
<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>

<h2>หน้า ผู้เบิกเงิน</h2>
<p>บทบาท: <strong id="role">กำลังตรวจสอบ...</strong></p>

<hr>

<h3>ขอเบิกเงิน</h3>
<input id="amount" placeholder="จำนวน ETH">
<input id="purpose" placeholder="วัตถุประสงค์">
<button onclick="request()">ขอเบิก</button>

<hr>

<h3>ถอนเงิน (หลังอนุมัติ)</h3>
<input id="index" placeholder="ลำดับคำขอ">
<button onclick="withdraw()">ถอนเงิน</button>

<script>
const contractAddress = "0x8aeE86E718015094bBD2e40263B894965fe32699";
const abi = [
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "_withdrawer",
				"type": "address"
			}
		],
		"stateMutability": "nonpayable",
		"type": "constructor"
	},
	{
		"inputs": [],
		"name": "approver",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "donate",
		"outputs": [],
		"stateMutability": "payable",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"name": "donations",
		"outputs": [
			{
				"internalType": "address",
				"name": "donor",
				"type": "address"
			},
			{
				"internalType": "uint256",
				"name": "amount",
				"type": "uint256"
			},
			{
				"internalType": "uint256",
				"name": "time",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "index",
				"type": "uint256"
			}
		],
		"name": "getDonation",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			},
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			},
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "getDonationCount",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "totalDonation",
		"outputs": [
			{
				"internalType": "uint256",
				"name": "",
				"type": "uint256"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "withdrawer",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
]; // ใช้ ABI เดิมของคุณ

let web3, contract, user;

async function connect() {
    web3 = new Web3(window.ethereum);
    await ethereum.request({ method: "eth_requestAccounts" });
    user = (await web3.eth.getAccounts())[0];
    contract = new web3.eth.Contract(abi, contractAddress);

    const withdrawer = await contract.methods.withdrawer().call();

    if (user.toLowerCase() !== withdrawer.toLowerCase()) {
        alert("คุณไม่ใช่ผู้เบิกเงิน");
        document.body.innerHTML = "";
        return;
    }

    document.getElementById("role").innerText = "ผู้เบิกเงิน";
}

async function request() {
    const eth = document.getElementById("amount").value;
    const purpose = document.getElementById("purpose").value;

    await contract.methods.requestWithdraw(
        web3.utils.toWei(eth, "ether"),
        purpose
    ).send({ from: user });

    alert("ส่งคำขอเบิกแล้ว");
}

async function withdraw() {
    const index = document.getElementById("index").value;
    await contract.methods.withdraw(index).send({ from: user });
    alert("ถอนเงินสำเร็จ");
}

connect();
</script>

</body>
</html>
