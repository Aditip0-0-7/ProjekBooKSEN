<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Withdrawer</title>
<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>

<h2>หน้า ผู้เบิกเงิน</h2>
<p>บทบาท: <strong id="role">กำลังตรวจสอบ...</strong></p>

<h3>ขอเบิกเงิน</h3>
<input id="amount" type="number" step="0.01" placeholder="จำนวน ETH">
<input id="purpose" placeholder="วัตถุประสงค์">
<button onclick="requestWithdraw()">ขอเบิก</button>

<hr>

<h3>คำขอของฉัน</h3>
<table border="1" cellpadding="6">
<thead>
<tr>
    <th>Index</th>
    <th>Amount (ETH)</th>
    <th>Purpose</th>
    <th>Status</th>
    <th>Action</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>
/* ================= CONFIG ================= */
const contractAddress = "0x8aeE86E718015094bBD2e40263B894965fe32699";

const abi = [
  {
    "inputs":[{"internalType":"address","name":"_withdrawer","type":"address"}],
    "stateMutability":"nonpayable",
    "type":"constructor"
  },
  {
    "inputs":[],
    "name":"withdrawer",
    "outputs":[{"internalType":"address","name":"","type":"address"}],
    "stateMutability":"view",
    "type":"function"
  },
  {
    "inputs":[],
    "name":"getWithdrawRequestCount",
    "outputs":[{"internalType":"uint256","name":"","type":"uint256"}],
    "stateMutability":"view",
    "type":"function"
  },
  {
    "inputs":[{"internalType":"uint256","name":"","type":"uint256"}],
    "name":"withdrawRequests",
    "outputs":[
      {"internalType":"address","name":"requester","type":"address"},
      {"internalType":"uint256","name":"amount","type":"uint256"},
      {"internalType":"string","name":"purpose","type":"string"},
      {"internalType":"bool","name":"approved","type":"bool"},
      {"internalType":"bool","name":"withdrawn","type":"bool"}
    ],
    "stateMutability":"view",
    "type":"function"
  },
  {
    "inputs":[
      {"internalType":"uint256","name":"amount","type":"uint256"},
      {"internalType":"string","name":"purpose","type":"string"}
    ],
    "name":"requestWithdraw",
    "outputs":[],
    "stateMutability":"nonpayable",
    "type":"function"
  },
  {
    "inputs":[{"internalType":"uint256","name":"index","type":"uint256"}],
    "name":"withdraw",
    "outputs":[],
    "stateMutability":"nonpayable",
    "type":"function"
  }
];

/* ================= GLOBAL ================= */
let web3, contract, user;

/* ================= CONNECT ================= */
async function connect() {
    if (!window.ethereum) {
        alert("กรุณาติดตั้ง MetaMask");
        return;
    }

    web3 = new Web3(window.ethereum);
    const accs = await ethereum.request({ method: "eth_requestAccounts" });
    user = accs[0];

    contract = new web3.eth.Contract(abi, contractAddress);

    const w = await contract.methods.withdrawer().call();
    if (user.toLowerCase() !== w.toLowerCase()) {
        alert("คุณไม่ใช่ผู้เบิก");
        document.body.innerHTML = "";
        return;
    }

    document.getElementById("role").innerText = "ผู้เบิกเงิน";
    loadRequests();
}

/* ================= REQUEST ================= */
async function requestWithdraw() {
    const eth = document.getElementById("amount").value;
    const purpose = document.getElementById("purpose").value;

    if (!eth || !purpose) {
        alert("กรุณากรอกข้อมูลให้ครบ");
        return;
    }

    await contract.methods.requestWithdraw(
        web3.utils.toWei(eth, "ether"),
        purpose
    ).send({ from: user });

    alert("ส่งคำขอเบิกแล้ว");
    loadRequests();
}

/* ================= LOAD ================= */
async function loadRequests() {
    const tbody = document.getElementById("list");
    tbody.innerHTML = "";

    const count = await contract.methods.getWithdrawRequestCount().call();

    for (let i = 0; i < count; i++) {
        const r = await contract.methods.withdrawRequests(i).call();

        // 🔹 แสดงเฉพาะของผู้เบิกคนนี้
        if (r.requester.toLowerCase() !== user.toLowerCase()) continue;

        let status = "⏳ รออนุมัติ";
        let btn = "-";

        if (r.approved && !r.withdrawn) {
            status = "✅ อนุมัติแล้ว";
            btn = `<button onclick="withdrawMoney(${i})">ถอนเงิน</button>`;
        }

        if (r.withdrawn) status = "💸 ถอนแล้ว";

        tbody.innerHTML += `
        <tr>
            <td>${i}</td>
            <td>${web3.utils.fromWei(r.amount,"ether")}</td>
            <td>${r.purpose}</td>
            <td>${status}</td>
            <td>${btn}</td>
        </tr>`;
    }
}

/* ================= WITHDRAW ================= */
async function withdrawMoney(index) {
    await contract.methods.withdraw(index).send({ from: user });
    alert("ถอนเงินสำเร็จ");
    loadRequests();
}

connect();
</script>

</body>
</html>
