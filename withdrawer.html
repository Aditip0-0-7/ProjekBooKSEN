<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Withdrawer</title>
<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>

<h2>💸 หน้าเบิกเงิน (Withdrawer)</h2>

<p>Network: <strong id="network">-</strong></p>

<hr>

<h3>📤 ขอเบิกเงิน</h3>
<input type="number" id="amount" placeholder="จำนวน ETH" step="0.001">
<br><br>
<input type="text" id="purpose" placeholder="วัตถุประสงค์">
<br><br>
<button onclick="requestWithdraw()">ขอเบิก</button>

<hr>

<h3>💰 เบิกเงิน (หลังอนุมัติ)</h3>
<input type="number" id="index" placeholder="Request Index">
<button onclick="withdraw()">ถอนเงิน</button>

<script>
const SEPOLIA_CHAIN_ID = "0xaa36a7";
const contractAddress = "0xdec37e195147ffd473b5c3d062a590032e5f8e33";

const abi = [
  {
    "inputs":[
      {"internalType":"uint256","name":"amount","type":"uint256"},
      {"internalType":"string","name":"purpose","type":"string"}
    ],
    "name":"requestWithdraw","outputs":[],"stateMutability":"nonpayable","type":"function"
  },
  {
    "inputs":[{"internalType":"uint256","name":"index","type":"uint256"}],
    "name":"withdraw","outputs":[],"stateMutability":"nonpayable","type":"function"
  }
];

let web3, contract, account;

async function connect() {
  await ethereum.request({
    method: "wallet_switchEthereumChain",
    params: [{ chainId: SEPOLIA_CHAIN_ID }]
  });

  web3 = new Web3(window.ethereum);
  await ethereum.request({ method: "eth_requestAccounts" });
  account = (await web3.eth.getAccounts())[0];

  contract = new web3.eth.Contract(abi, contractAddress);
  document.getElementById("network").innerText = "Sepolia";
}

async function requestWithdraw() {
  const eth = document.getElementById("amount").value;
  const purpose = document.getElementById("purpose").value;

  if (eth <= 0) {
    alert("จำนวน ETH ต้องมากกว่า 0");
    return;
  }

  // ⭐ แปลง ETH → wei (สำคัญมาก)
  const weiAmount = web3.utils.toWei(eth, "ether");

  await contract.methods.requestWithdraw(weiAmount, purpose).send({
    from: account
  });

  alert("ส่งคำขอเบิกสำเร็จ");
}

async function withdraw() {
  const index = document.getElementById("index").value;

  await contract.methods.withdraw(index).send({
    from: account
  });

  alert("ถอนเงินสำเร็จ");
}

connect();
</script>

</body>
</html>
