<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Withdrawer</title>
<script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body>

<h2>💸 หน้าเบิกเงิน (Withdrawer)</h2>

<h3>ขอเบิกเงิน</h3>
<input id="amount" type="number" step="0.01" placeholder="จำนวน ETH">
<input id="purpose" type="text" placeholder="วัตถุประสงค์">
<button onclick="requestWithdraw()">ขอเบิก</button>

<hr>

<h3>📋 คำขอเบิกของคุณ</h3>
<table border="1">
<thead>
<tr>
<th>Index</th>
<th>Amount (ETH)</th>
<th>Purpose</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>
const contractAddress = "0x8aeE86E718015094bBD2e40263B894965fe32699";

const abi = [
    {"inputs":[{"internalType":"uint256","name":"_amount","type":"uint256"},{"internalType":"string","name":"_purpose","type":"string"}],"name":"requestWithdraw","outputs":[],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[{"internalType":"uint256","name":"index","type":"uint256"}],"name":"withdraw","outputs":[],"stateMutability":"nonpayable","type":"function"},
    {"inputs":[],"name":"getWithdrawRequestCount","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
    {"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"withdrawRequests","outputs":[
        {"internalType":"uint256","name":"amount","type":"uint256"},
        {"internalType":"string","name":"purpose","type":"string"},
        {"internalType":"bool","name":"approved","type":"bool"},
        {"internalType":"bool","name":"withdrawn","type":"bool"}
    ],"stateMutability":"view","type":"function"}
];

let web3, contract, account;

async function connect() {
    web3 = new Web3(window.ethereum);
    const accs = await ethereum.request({ method: "eth_requestAccounts" });
    account = accs[0];
    contract = new web3.eth.Contract(abi, contractAddress);
    loadRequests();
}

async function requestWithdraw() {
    const eth = document.getElementById("amount").value;
    const purpose = document.getElementById("purpose").value;

    await contract.methods.requestWithdraw(
        web3.utils.toWei(eth, "ether"),
        purpose
    ).send({ from: account });

    alert("ส่งคำขอแล้ว");
    loadRequests();
}

async function withdraw(index) {
    await contract.methods.withdraw(index).send({ from: account });
    alert("ถอนเงินสำเร็จ");
    loadRequests();
}

async function loadRequests() {
    const tbody = document.getElementById("list");
    tbody.innerHTML = "";

    const count = await contract.methods.getWithdrawRequestCount().call();

    for (let i = 0; i < count; i++) {
        const r = await contract.methods.withdrawRequests(i).call();

        let status = "⏳ รออนุมัติ";
        let action = "-";

        if (r.approved && !r.withdrawn) {
            status = "✅ อนุมัติแล้ว";
            action = `<button onclick="withdraw(${i})">ถอน</button>`;
        }

        if (r.withdrawn) {
            status = "💸 ถอนแล้ว";
        }

        tbody.innerHTML += `
        <tr>
            <td>${i}</td>
            <td>${web3.utils.fromWei(r.amount,"ether")}</td>
            <td>${r.purpose}</td>
            <td>${status}</td>
            <td>${action}</td>
        </tr>`;
    }
}

connect();
</script>

</body>
</html>
